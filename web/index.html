<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0B6B4F">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <title>Bookkeeper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/cards.css">
    <link rel="stylesheet" href="/css/controls.css">
    <link rel="stylesheet" href="/css/lists.css">
    <link rel="stylesheet" href="/css/person.css">
    <link rel="stylesheet" href="/css/forms.css">
    <link rel="stylesheet" href="/css/feedback.css">
</head>

<body>
    <div id="app"></div>
    <aside id="analytics-consent" class="analytics-consent" role="region" aria-labelledby="analytics-consent-title" hidden>
        <div>
            <b id="analytics-consent-title">Help improve Bookkeepr</b>
            <p>Allow PostHog to collect page visits and limited feature usage, including broad entry type. Amounts, names, notes, and record IDs are never sent. You can change this choice later in Account.</p>
        </div>
        <div class="analytics-consent-actions">
            <button type="button" class="mini" data-act="analytics-decline">Decline</button>
            <button type="button" class="mini" data-act="analytics-accept">Allow analytics</button>
        </div>
    </aside>
    <div id="toast" role="status" aria-live="polite" data-testid="toast" hidden></div>
    <noscript>Bookkeeper needs JavaScript.</noscript>
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
    <!-- plain scripts that share one scope; the order matters, app.js must be last -->
    <script src="/js/util.js"></script>
    <script src="/js/state.js"></script>
    <script src="/js/store.js"></script>
    <script src="/js/engine.js"></script>
    <script src="/js/sync.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/views/home.js"></script>
    <script src="/js/views/entries.js"></script>
    <script src="/js/views/people.js"></script>
    <script src="/js/views/inventory.js"></script>
    <script src="/js/views/analytics.js"></script>
    <script src="/js/analytics.js"></script>
    <script src="/js/form.js"></script>
    <script src="/js/panels.js"></script>
    <script src="/js/invoice.js"></script>
    <script src="/js/app.js"></script>
</body>

</html>
